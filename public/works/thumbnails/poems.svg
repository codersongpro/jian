<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460"><rect width="600" height="460" rx="18" fill="#f3f0e9"/><g fill="#243a36" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="42" y="68" font-size="15">실제 작품 텍스트 미리보기</text><text x="42" y="119" font-size="29" font-weight="bold">동시 다섯 편</text><text x="42" y="174" font-size="22">튤립은 참 끈기있다.</text><text x="42" y="216" font-size="22">기나긴 추위를 기다리고</text><text x="42" y="258" font-size="22">새싹이 나왔으니까</text><text x="42" y="416" font-size="14">원본을 바탕으로 만든 발췌 전사 카드</text></g></svg>