<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460"><rect width="600" height="460" rx="18" fill="#f3f0e9"/><g fill="#243a36" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="42" y="68" font-size="15">실제 작품 텍스트 미리보기</text><text x="42" y="119" font-size="29" font-weight="bold">A Letter to Fall</text><text x="42" y="174" font-size="22">Dear Fall,</text><text x="42" y="216" font-size="22">You gave me present like fruits,</text><text x="42" y="258" font-size="22">vegetable, and acorns.</text><text x="42" y="416" font-size="14">원본을 바탕으로 만든 발췌 전사 카드</text></g></svg>